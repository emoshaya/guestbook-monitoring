global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: guestbook
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [__NAMESPACE__]
    relabel_configs:
      # discover services with prometheus.io/scrape enabled
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_part_of]
        action: keep
        regex: guestbook
      # scrape the metrics port, excluding the application ports
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        action: keep
        regex: metrics
      - source_labels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_service_label_component]
        target_label: component
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
